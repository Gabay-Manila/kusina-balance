  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      /* 共通ベース（墨×クリーム） */
      --ink: #2B2926;
      --cream: #EFEAE0;
      --cream-deep: #E4DECE;
      --stone: #C9C2B4;
      --stone-line: #DDD6C6;

      /* 案内・生活ガイド系（バナナ） */
      --accent-fill: #E0B23A;
      --accent-text: #8C6A1D;
    }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mincho {
      font-family: 'Shippori Mincho', serif;
    }

    /* 共通コンポーネント仕様 */
    .btn-primary {
      background-color: var(--accent-fill);
      color: var(--cream);
      font-weight: 700;
      min-height: 44px;
      min-width: 44px;
    }
    .btn-primary:active {
      opacity: 0.9;
    }

    .btn-ghost {
      background-color: transparent;
      border: 1.5px solid var(--accent-fill);
      color: var(--accent-text);
      font-weight: 700;
      min-height: 40px;
    }

    .card-base {
      background-color: #FAF8F5;
      border: 1px solid var(--stone-line);
    }

    .card-deep {
      background-color: var(--cream-deep);
      border: 1px solid var(--stone-line);
    }

    .chip-accent {
      border: 1px solid var(--accent-fill);
      color: var(--accent-text);
      background-color: #FAF8F5;
    }

    .badge-accent {
      border: 1.5px solid var(--accent-fill);
      color: var(--accent-text);
    }

    .tab-item {
      border-bottom: 2px solid transparent;
      color: var(--stone);
    }
    .tab-item.active {
      border-bottom: 2px solid var(--accent-fill);
      color: var(--accent-text);
      font-weight: 700;
    }

    .progress-track {
      background-color: var(--stone);
    }
    .progress-fill {
      background-color: var(--accent-fill);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="antialiased min-h-screen pb-28 select-none">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#FAF8F5] px-4 py-3 border-b border-[#DDD6C6] shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <div class="flex items-center space-x-1.5">
          <span class="font-mincho text-lg font-bold tracking-tight text-[#2B2926]">KusinaBalance</span>
          <span class="text-[10px] font-mincho px-1.5 py-0.5 rounded border border-[#E0B23A] text-[#8C6A1D]" data-i18n="appSubtitle">生活献立帳</span>
        </div>
        <p class="text-[11px] text-[#2B2926]/70" data-i18n="tagline">マニラ・ローカル食材で整える健康食</p>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="playAudioTone(); toggleLang();" class="btn-ghost px-2.5 py-1.5 rounded-lg flex items-center space-x-1 text-xs active:scale-95 transition">
          <i data-lucide="languages" class="w-3.5 h-3.5"></i>
          <span class="font-mincho" id="lang-toggle-label">English</span>
        </button>
        <button onclick="playAudioTone(); randomizeAll();" class="btn-ghost px-3 py-1.5 rounded-lg flex items-center space-x-1.5 text-xs active:scale-95 transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span class="font-mincho" data-i18n="bulkGenerate">一括生成</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container (1-2 Scrolls max on mobile) -->
  <main class="max-w-md mx-auto p-3.5 space-y-3.5">

    <!-- Top Summary Banner -->
    <div onclick="playAudioTone(); switchTab('settings');" class="card-deep rounded-xl p-3.5 flex items-center justify-between cursor-pointer active:opacity-90 transition">
      <div class="space-y-1">
        <div class="flex items-center space-x-2">
          <span class="badge-accent font-mincho text-[11px] px-2 py-0.5 rounded-full bg-[#FAF8F5]" id="badge-age">70代</span>
          <span class="font-mincho text-xs font-bold text-[#8C6A1D]" id="badge-conditions">減塩・Mg補給</span>
        </div>
        <div class="text-[11px] text-[#2B2926]/70 flex items-center gap-1" id="summary-avoid-text">
          <i data-lucide="sliders-horizontal" class="w-3 h-3 text-[#8C6A1D]"></i>
          <span>設定条件に合わせて最適化中</span>
        </div>
      </div>
      <div class="flex items-center text-xs font-mincho font-bold text-[#8C6A1D]">
        <span data-i18n="changeConditions">条件変更</span>
        <i data-lucide="chevron-right" class="w-4 h-4 ml-0.5"></i>
      </div>
    </div>

    <!-- Mg Progress Bar (Pattern: stone track + accent-fill) -->
    <div class="card-base rounded-xl p-3 space-y-1.5">
      <div class="flex items-center justify-between text-xs">
        <span class="font-mincho font-bold text-[#2B2926] flex items-center gap-1">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-[#8C6A1D]"></i>
          <span data-i18n="mgProgressLabel">今週のマグネシウム補給達成度</span>
        </span>
        <span class="font-mincho font-bold text-[#8C6A1D]" id="mg-ratio-text">7 / 7 日達成</span>
      </div>
      <div class="w-full h-2 rounded-full progress-track overflow-hidden">
        <div id="mg-progress-bar" class="h-full progress-fill rounded-full transition-all duration-300" style="width: 100%;"></div>
      </div>
    </div>

    <!-- TAB 1: 週間献立 (Week Plan) -->
    <div id="tab-plan" class="space-y-2.5">
      <div id="days-container" class="space-y-2.5">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- TAB 2: 買い物帳 (Shopping List) -->
    <div id="tab-shopping" class="hidden space-y-3">
      <div class="card-base rounded-xl p-3.5 space-y-3">
        <div class="flex items-center justify-between border-b border-[#DDD6C6] pb-2">
          <div>
            <h2 class="font-mincho font-bold text-sm text-[#2B2926] flex items-center gap-1">
              <i data-lucide="shopping-cart" class="w-4 h-4 text-[#8C6A1D]"></i>
              <span data-i18n="shoppingTitle">パレンケ・スーパー買い出し帳</span>
            </h2>
            <p class="text-[11px] text-[#2B2926]/70" data-i18n="shoppingSubtitle">1週間の献立から食材を自動集計します</p>
          </div>
          <button onclick="playAudioTone(); clearCheckedItems();" class="text-[11px] text-[#8C6A1D] underline" data-i18n="resetBtn">リセット</button>
        </div>

        <div id="shopping-list-content" class="space-y-3">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>

    <!-- TAB 3: 料理一覧 (Dishes) -->
    <div id="tab-recipes" class="hidden space-y-3">
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1 text-xs">
        <button onclick="playAudioTone(); filterRecipeList('all')" class="recipe-filter-btn px-3 py-1 rounded-full font-mincho font-bold bg-[#E0B23A] text-[#2B2926]" data-filter="all" data-i18n="filterAll">すべて</button>
        <button onclick="playAudioTone(); filterRecipeList('mg')" class="recipe-filter-btn px-3 py-1 rounded-full font-mincho card-base text-[#2B2926]" data-filter="mg" data-i18n="filterMg">Mg高含有</button>
        <button onclick="playAudioTone(); filterRecipeList('breakfast')" class="recipe-filter-btn px-3 py-1 rounded-full font-mincho card-base text-[#2B2926]" data-filter="breakfast" data-i18n="filterBreakfast">朝食</button>
        <button onclick="playAudioTone(); filterRecipeList('lunch')" class="recipe-filter-btn px-3 py-1 rounded-full font-mincho card-base text-[#2B2926]" data-filter="lunch" data-i18n="filterLunch">昼食</button>
        <button onclick="playAudioTone(); filterRecipeList('dinner')" class="recipe-filter-btn px-3 py-1 rounded-full font-mincho card-base text-[#2B2926]" data-filter="dinner" data-i18n="filterDinner">夕食</button>
      </div>

      <div id="recipe-master-list" class="space-y-2">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- TAB 4: 条件設定 (Settings) -->
    <div id="tab-settings" class="hidden space-y-3">
      <div class="card-base rounded-xl p-4 space-y-4">
        
        <div class="border-b border-[#DDD6C6] pb-2">
          <h2 class="font-mincho font-bold text-sm text-[#2B2926] flex items-center gap-1.5">
            <i data-lucide="sliders" class="w-4 h-4 text-[#8C6A1D]"></i>
            <span data-i18n="settingsTitle">献立の条件・健康設定</span>
          </h2>
          <p class="text-[11px] text-[#2B2926]/70" data-i18n="settingsSubtitle">設定条件に合わせて「一括生成」が動作します</p>
        </div>

        <!-- 年齢 -->
        <div class="space-y-1">
          <label class="font-mincho text-xs font-bold text-[#2B2926]" data-i18n="ageLabel">年代</label>
          <select id="setting-age" onchange="saveProfileSettings()" class="w-full text-xs p-2.5 rounded-lg border border-[#DDD6C6] bg-[#FAF8F5] focus:outline-none focus:border-[#E0B23A]">
            <option value="60s" data-i18n="age60">60代（消化・活力）</option>
            <option value="70s" selected data-i18n="age70">70代（減塩・柔らかめ・ミネラル補給）</option>
            <option value="80s" data-i18n="age80">80代（高消化・小分け・滋養）</option>
            <option value="general" data-i18n="ageGeneral">一般</option>
          </select>
        </div>

        <!-- 持病・重点ケア -->
        <div class="space-y-2">
          <label class="font-mincho text-xs font-bold text-[#2B2926]" data-i18n="conditionsLabel">重点ケア項目（複数選択可）</label>
          <div class="grid grid-cols-1 gap-1.5 text-xs">
            <label class="flex items-center space-x-2.5 p-2 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" id="cond-low-sodium" onchange="saveProfileSettings()" checked class="w-4 h-4 rounded text-[#E0B23A] focus:ring-0">
              <div>
                <div class="font-mincho font-bold text-xs" data-i18n="condLowSodiumTitle">減塩ケア（出汁・生姜風味）</div>
                <div class="text-[10px] text-[#2B2926]/70" data-i18n="condLowSodiumDesc">パティスや塩分を控えめに調整します</div>
              </div>
            </label>
            <label class="flex items-center space-x-2.5 p-2 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" id="cond-mg-boost" onchange="saveProfileSettings()" checked class="w-4 h-4 rounded text-[#E0B23A] focus:ring-0">
              <div>
                <div class="font-mincho font-bold text-xs" data-i18n="condMgTitle">マグネシウム積極補給</div>
                <div class="text-[10px] text-[#2B2926]/70" data-i18n="condMgDesc">モリンガ、緑豆、カカオ、豆腐を優先します</div>
              </div>
            </label>
            <label class="flex items-center space-x-2.5 p-2 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" id="cond-low-oil" onchange="saveProfileSettings()" checked class="w-4 h-4 rounded text-[#E0B23A] focus:ring-0">
              <div>
                <div class="font-mincho font-bold text-xs" data-i18n="condLowOilTitle">胃腸・脂質ケア（低油分）</div>
                <div class="text-[10px] text-[#2B2926]/70" data-i18n="condLowOilDesc">蒸し物・スープ・煮込み料理を優先します</div>
              </div>
            </label>
            <label class="flex items-center space-x-2.5 p-2 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" id="cond-low-purine" onchange="saveProfileSettings()" class="w-4 h-4 rounded text-[#E0B23A] focus:ring-0">
              <div>
                <div class="font-mincho font-bold text-xs" data-i18n="condLowPurineTitle">プリン体ケア</div>
                <div class="text-[10px] text-[#2B2926]/70" data-i18n="condLowPurineDesc">甲殻類・過度な肉類を控えます</div>
              </div>
            </label>
            <label class="flex items-center space-x-2.5 p-2 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" id="cond-japanese-treat" onchange="saveProfileSettings()" checked class="w-4 h-4 rounded text-[#E0B23A] focus:ring-0">
              <div>
                <div class="font-mincho font-bold text-xs" data-i18n="condJapaneseTitle">たまに日本の味も楽しむ</div>
                <div class="text-[10px] text-[#2B2926]/70" data-i18n="condJapaneseDesc">卵焼きや親子丼など和食メニューを時々織り交ぜます</div>
              </div>
            </label>
          </div>
        </div>

        <!-- 苦手な食材 -->
        <div class="space-y-1.5">
          <label class="font-mincho text-xs font-bold text-[#2B2926]" data-i18n="avoidLabel">除外したい食材</label>
          <div class="flex flex-wrap gap-1.5 text-xs">
            <label class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" class="avoid-checkbox" value="ampalaya" onchange="saveProfileSettings()">
              <span class="text-[11px]" data-i18n="avoidAmpalaya">ゴーヤ</span>
            </label>
            <label class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" class="avoid-checkbox" value="shellfish" onchange="saveProfileSettings()">
              <span class="text-[11px]" data-i18n="avoidShellfish">エビ・甲殻類</span>
            </label>
            <label class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" class="avoid-checkbox" value="pork" onchange="saveProfileSettings()">
              <span class="text-[11px]" data-i18n="avoidPork">豚肉</span>
            </label>
            <label class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" class="avoid-checkbox" value="fish" onchange="saveProfileSettings()">
              <span class="text-[11px]" data-i18n="avoidFish">魚介</span>
            </label>
            <label class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg card-deep cursor-pointer">
              <input type="checkbox" class="avoid-checkbox" value="spicy" onchange="saveProfileSettings()" checked>
              <span class="text-[11px]" data-i18n="avoidSpicy">激辛・唐辛子</span>
            </label>
          </div>
        </div>

        <!-- 保存ボタン -->
        <button onclick="playAudioTone(); applySettingsAndGenerate();" class="btn-primary w-full py-2.5 rounded-xl font-mincho text-xs flex items-center justify-center space-x-1.5 shadow-sm active:scale-95 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          <span data-i18n="saveBtn">設定を反映して再編成します</span>
        </button>

      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar (Accent Line + Mincho Labels) -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-[#FAF8F5] border-t border-[#DDD6C6] py-2 px-3 flex justify-around max-w-md mx-auto shadow-md">
    <button onclick="playAudioTone(); switchTab('plan')" id="nav-plan" class="tab-item active flex flex-col items-center gap-0.5 px-3 py-1 transition">
      <i data-lucide="calendar" class="w-4 h-4"></i>
      <span class="text-[10px] font-mincho" data-i18n="navPlan">週間献立</span>
    </button>
    <button onclick="playAudioTone(); switchTab('shopping')" id="nav-shopping" class="tab-item flex flex-col items-center gap-0.5 px-3 py-1 transition">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i>
      <span class="text-[10px] font-mincho" data-i18n="navShopping">買い物帳</span>
    </button>
    <button onclick="playAudioTone(); switchTab('recipes')" id="nav-recipes" class="tab-item flex flex-col items-center gap-0.5 px-3 py-1 transition">
      <i data-lucide="book-open" class="w-4 h-4"></i>
      <span class="text-[10px] font-mincho" data-i18n="navRecipes">料理帳</span>
    </button>
    <button onclick="playAudioTone(); switchTab('settings')" id="nav-settings" class="tab-item flex flex-col items-center gap-0.5 px-3 py-1 transition">
      <i data-lucide="sliders" class="w-4 h-4"></i>
      <span class="text-[10px] font-mincho" data-i18n="navSettings">条件設定</span>
    </button>

    let audioCtx = null;
    function playAudioTone() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(437, audioCtx.currentTime); // 437Hz Unified Brand Sound
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

      sun: { breakfast: "d_pandesal_egg", lunch: "d_tofu_mushroom_ankake", dinner: "d_bangus_grilled" }
    };

    let profile = JSON.parse(localStorage.getItem("kusina_banana_profile")) || DEFAULT_PROFILE;
    let schedule = JSON.parse(localStorage.getItem("kusina_banana_sched")) || DEFAULT_SCHEDULE;
    let checkedIngredients = JSON.parse(localStorage.getItem("kusina_banana_checks")) || {};
    let activeModalContext = null;
    let langMode = localStorage.getItem("kusina_banana_lang") || "ja";
    let currentRecipeFilter = "all";
    let currentModalFilter = "all";

    // ==========================================
    // 2c. LANGUAGE TOGGLE
    // ==========================================
    function t(key) {
      return (UI_STRINGS[langMode] && UI_STRINGS[langMode][key]) || (UI_STRINGS.ja && UI_STRINGS.ja[key]) || key;
    }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.documentElement.lang = langMode;
      const label = document.getElementById("lang-toggle-label");
      if (label) label.textContent = langMode === "ja" ? "English" : "日本語";
    }

    function toggleLang() {
      langMode = langMode === "ja" ? "en" : "ja";
      localStorage.setItem("kusina_banana_lang", langMode);
      applyI18n();
      updateProfileBadges();
      renderWeeklyPlan();
      renderShoppingList();
      if (!document.getElementById("tab-recipes").classList.contains("hidden")) {
        renderRecipeMasterList(currentRecipeFilter);
      }
      if (activeModalContext) {
        updateModalTitle();
        renderModalList(currentModalFilter);
      }
    }

    // ==========================================
    // 3. LOGIC & RENDER
    // ==========================================
    function saveProfileSettings() {
      profile.age = document.getElementById("setting-age").value;
      profile.conditions = {
        lowSodium: document.getElementById("cond-low-sodium").checked,
        mgBoost: document.getElementById("cond-mg-boost").checked,
        lowOil: document.getElementById("cond-low-oil").checked,
        lowPurine: document.getElementById("cond-low-purine").checked,
        japaneseTreat: document.getElementById("cond-japanese-treat").checked,
      };

      const avoids = [];
      document.querySelectorAll(".avoid-checkbox:checked").forEach(cb => avoids.push(cb.value));
      profile.avoid = avoids;

      localStorage.setItem("kusina_banana_profile", JSON.stringify(profile));
      updateProfileBadges();
    }

    function loadProfileToUI() {
      if (document.getElementById("setting-age")) {
        document.getElementById("setting-age").value = profile.age || "70s";
      }
      if (profile.conditions) {
        document.getElementById("cond-low-sodium").checked = !!profile.conditions.lowSodium;
        document.getElementById("cond-mg-boost").checked = !!profile.conditions.mgBoost;
        document.getElementById("cond-low-oil").checked = !!profile.conditions.lowOil;
        document.getElementById("cond-low-purine").checked = !!profile.conditions.lowPurine;
        document.getElementById("cond-japanese-treat").checked = profile.conditions.japaneseTreat !== false;
      }
      document.querySelectorAll(".avoid-checkbox").forEach(cb => {
        cb.checked = profile.avoid && profile.avoid.includes(cb.value);
      });
      updateProfileBadges();
    }

    function updateProfileBadges() {
      document.getElementById("badge-age").textContent = AGE_BADGE[langMode][profile.age] || AGE_BADGE[langMode]["70s"];

      const condList = [];
      if (profile.conditions.lowSodium) condList.push(COND_BADGE[langMode].lowSodium);
      if (profile.conditions.mgBoost) condList.push(COND_BADGE[langMode].mgBoost);
      if (profile.conditions.lowOil) condList.push(COND_BADGE[langMode].lowOil);
      if (profile.conditions.lowPurine) condList.push(COND_BADGE[langMode].lowPurine);

      const basicLabel = langMode === "en" ? "Basic Diet" : "基本食";
      document.getElementById("badge-conditions").textContent = condList.slice(0, 2).join(langMode === "en" ? " / " : "・") || basicLabel;

      const avoidsTxt = (profile.avoid || []).map(a => AVOID_BADGE[langMode][a] || a).join(", ");
      const defaultText = langMode === "en" ? "Optimizing to your settings" : "設定条件に合わせて最適化中";
      document.getElementById("summary-avoid-text").innerHTML = avoidsTxt
        ? `<i data-lucide="ban" class="w-3 h-3 text-[#8C6A1D]"></i><span>${avoidsTxt}${langMode === "en" ? " excluded" : "で自動編成中"}</span>`
        : `<i data-lucide="sliders-horizontal" class="w-3 h-3 text-[#8C6A1D]"></i><span>${defaultText}</span>`;
      safeCreateIcons();
    }

    function applySettingsAndGenerate() {
      saveProfileSettings();
      randomizeAll();
      switchTab('plan');
    }

    function getValidDishes(mealType) {
      return DISHES.filter(d => {
        if (d.mealType !== mealType) return false;
        if (d.tags.includes('japanese') && !(profile.conditions && profile.conditions.japaneseTreat)) return false;
        if (profile.avoid && profile.avoid.some(tag => d.avoidTags.includes(tag))) return false;
        if (profile.conditions.lowPurine && (d.avoidTags.includes('shellfish') || d.avoidTags.includes('pork'))) return false;
        return true;
      });
    }

    function randomizeAll() {
      DAYS_CONFIG.forEach(d => {
        let breakfasts = getValidDishes("breakfast");
        let lunches = getValidDishes("lunch");
        let dinners = getValidDishes("dinner");

        if (breakfasts.length === 0) breakfasts = DISHES.filter(x => x.mealType === "breakfast");
        if (lunches.length === 0) lunches = DISHES.filter(x => x.mealType === "lunch");
        if (dinners.length === 0) dinners = DISHES.filter(x => x.mealType === "dinner");

        if (profile.conditions.mgBoost) {
          const highDin = dinners.filter(x => x.mgLevel === "high");
          const highBf = breakfasts.filter(x => x.mgLevel === "high");

          schedule[d.key] = {
            breakfast: (highBf.length > 0 && Math.random() > 0.4) ? highBf[Math.floor(Math.random() * highBf.length)].id : breakfasts[Math.floor(Math.random() * breakfasts.length)].id,
            lunch: lunches[Math.floor(Math.random() * lunches.length)].id,
            dinner: (highDin.length > 0 && Math.random() > 0.3) ? highDin[Math.floor(Math.random() * highDin.length)].id : dinners[Math.floor(Math.random() * dinners.length)].id,
          };
        } else {
          schedule[d.key] = {
            breakfast: breakfasts[Math.floor(Math.random() * breakfasts.length)].id,
            lunch: lunches[Math.floor(Math.random() * lunches.length)].id,
            dinner: dinners[Math.floor(Math.random() * dinners.length)].id,
          };
        }
      });
      saveSchedule();
    }

    function saveSchedule() {
      localStorage.setItem("kusina_banana_sched", JSON.stringify(schedule));
      renderWeeklyPlan();
      renderShoppingList();
    }

    function getDish(id) {
      return DISHES.find(d => d.id === id) || DISHES[0];
    }

    function renderMealRow(dayKey, mealType, dish, mealLabel) {
      const primary = langMode === "en" ? dish.name : dish.nameJa;
      const secondary = langMode === "en" ? dish.nameJa : dish.name;
      return `
        <div onclick="playAudioTone(); openModal('${dayKey}', '${mealType}')" class="flex items-center justify-between p-2 rounded-lg card-deep cursor-pointer hover:border-[#E0B23A] transition">
          <div class="flex items-center space-x-2">
            <span class="font-mincho font-bold text-[11px] text-[#8C6A1D]">${mealLabel}</span>
            <div>
              <div class="font-bold text-[#2B2926] text-xs">${primary}</div>
              <div class="text-[10px] text-[#2B2926]/60">${secondary}</div>
            </div>
          </div>
          ${dish.mgLevel === 'high' ? '<span class="chip-accent text-[9px] font-bold px-1 rounded">Mg</span>' : '<i data-lucide="chevron-right" class="w-3.5 h-3.5 text-[#C9C2B4]"></i>'}
        </div>
      `;
    }

    function renderWeeklyPlan() {
      const container = document.getElementById("days-container");
      container.innerHTML = "";
      let highMgDays = 0;
      const mealShort = MEAL_LABEL_SHORT[langMode];

      DAYS_CONFIG.forEach(d => {
        const dayPlan = schedule[d.key];
        const bf = getDish(dayPlan.breakfast);
        const lu = getDish(dayPlan.lunch);
        const di = getDish(dayPlan.dinner);

        const hasMg = [bf, lu, di].some(dish => dish.mgLevel === "high");
        if (hasMg) highMgDays++;

        const dayLabel = langMode === "en" ? d.labelEn : d.label;
        const dayShort = langMode === "en" ? d.shortEn : d.short;
        const statusLabel = hasMg ? STATUS_LABEL[langMode].mg : STATUS_LABEL[langMode].standard;

        const card = document.createElement("div");
        card.className = "card-base rounded-xl p-3 shadow-xs space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-[#DDD6C6] pb-1.5">
            <div class="flex items-center space-x-2">
              <span class="font-mincho font-bold text-xs bg-[#E4DECE] text-[#2B2926] px-2 py-0.5 rounded">${dayShort}</span>
              <span class="font-mincho font-bold text-xs text-[#2B2926]">${dayLabel}</span>
            </div>
            ${hasMg
              ? `<span class="font-mincho text-[10px] text-[#8C6A1D] border border-[#E0B23A] bg-[#FAF8F5] px-1.5 py-0.5 rounded">${statusLabel}</span>`
              : `<span class="text-[10px] text-[#C9C2B4]">${statusLabel}</span>`}
          </div>

          <div class="space-y-1 text-xs">
            ${renderMealRow(d.key, 'breakfast', bf, mealShort.breakfast)}
            ${renderMealRow(d.key, 'lunch', lu, mealShort.lunch)}
            ${renderMealRow(d.key, 'dinner', di, mealShort.dinner)}
          </div>
        `;
        container.appendChild(card);
      });

      const ratioLabel = langMode === "en" ? `${highMgDays} / 7 days met` : `${highMgDays} / 7 日達成`;
      document.getElementById("mg-ratio-text").textContent = ratioLabel;
      document.getElementById("mg-progress-bar").style.width = `${(highMgDays / 7) * 100}%`;
      safeCreateIcons();
    }

    function renderShoppingList() {
      const container = document.getElementById("shopping-list-content");
      container.innerHTML = "";

      // Aggregation key is always the Japanese ingredient name so the
      // checked/unchecked state survives switching languages.
      const aggregated = {};
      DAYS_CONFIG.forEach(d => {
        const plan = schedule[d.key];
        ['breakfast', 'lunch', 'dinner'].forEach(m => {
          const dish = getDish(plan[m]);
          dish.ingredients.forEach(ing => {
            const cat = ing.cat || 'dry';
            const key = ing.item;
            if (!aggregated[cat]) aggregated[cat] = {};
            if (!aggregated[cat][key]) aggregated[cat][key] = { count: 0, itemEn: ing.itemEn || ing.item };
            aggregated[cat][key].count += 1;
          });
        });
      });

      Object.keys(CATEGORY_NAMES).forEach(catKey => {
        if (!aggregated[catKey] || Object.keys(aggregated[catKey]).length === 0) return;

        const box = document.createElement("div");
        box.className = "space-y-1";

        let html = "";
        Object.keys(aggregated[catKey]).forEach(itemKey => {
          const data = aggregated[catKey][itemKey];
          const count = data.count;
          const isChecked = !!checkedIngredients[itemKey];
          const countLabel = langMode === "en" ? `x${count}` : `${count}回分`;
          const displayName = langMode === "en" ? data.itemEn : itemKey;
          const safeKey = itemKey.replace(/'/g, "\\'");

          html += `
            <label class="flex items-center justify-between p-2 rounded-lg card-deep cursor-pointer text-xs select-none">
              <div class="flex items-center space-x-2.5">
                <input type="checkbox" onchange="playAudioTone(); toggleCheckItem('${safeKey}')" ${isChecked ? 'checked' : ''} 
                  class="w-4 h-4 rounded text-[#E0B23A] focus:ring-0">
                <span class="${isChecked ? 'line-through text-[#C9C2B4]' : 'text-[#2B2926] font-medium'}">${displayName}</span>
              </div>
              <span class="font-mincho text-[10px] text-[#8C6A1D] px-1.5 py-0.5 rounded border border-[#DDD6C6] bg-[#FAF8F5]">${countLabel}</span>
            </label>
          `;
        });

        box.innerHTML = `
          <h3 class="font-mincho font-bold text-xs text-[#2B2926] mt-2 mb-1">${CATEGORY_NAMES[catKey][langMode]}</h3>
          <div class="space-y-1">${html}</div>
        `;
        container.appendChild(box);
      });
      safeCreateIcons();
    }

    function toggleCheckItem(key) {
      checkedIngredients[key] = !checkedIngredients[key];
      localStorage.setItem("kusina_banana_checks", JSON.stringify(checkedIngredients));
      renderShoppingList();
    }

    function clearCheckedItems() {
      checkedIngredients = {};
      localStorage.setItem("kusina_banana_checks", JSON.stringify(checkedIngredients));
      renderShoppingList();
    }

    function renderRecipeMasterList(filter = "all") {
      currentRecipeFilter = filter;
      const container = document.getElementById("recipe-master-list");
      container.innerHTML = "";

      let list = DISHES;
      if (filter === "mg") list = DISHES.filter(d => d.mgLevel === "high");
      if (["breakfast", "lunch", "dinner"].includes(filter)) list = DISHES.filter(d => d.mealType === filter);

      const mealShort = MEAL_LABEL_SHORT[langMode];

      list.forEach(dish => {
        const primary = langMode === "en" ? dish.name : dish.nameJa;
        const secondary = langMode === "en" ? dish.nameJa : dish.name;
        const tip = langMode === "en" ? (dish.tipEn || dish.tip) : dish.tip;
        const ingredientsText = dish.ingredients.map(i => langMode === "en" ? (i.itemEn || i.item) : i.item).join(', ');
        const mealLabel = dish.mealType === 'breakfast' ? mealShort.breakfast : dish.mealType === 'lunch' ? mealShort.lunch : mealShort.dinner;
        const jpBadge = langMode === "en" ? "JP" : "和食";
        const stepsList = langMode === "en" ? (dish.stepsEn || dish.steps) : dish.steps;
        const hasSteps = stepsList && stepsList.length > 0;
        const stepsHtml = hasSteps
          ? `<ol class="hidden list-decimal list-inside space-y-1 text-[10px] text-[#2B2926]/80 pl-1" id="steps-${dish.id}">${stepsList.map(s => `<li>${s}</li>`).join('')}</ol>`
          : '';
        const toggleBtn = hasSteps
          ? `<button onclick="playAudioTone(); toggleRecipeSteps('${dish.id}')" class="text-[10px] font-mincho font-bold text-[#8C6A1D] underline" id="steps-toggle-${dish.id}">${t('viewSteps')}</button>`
          : '';

        const card = document.createElement("div");
        card.className = "card-base p-3 rounded-xl space-y-1.5 shadow-xs";
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="font-mincho font-bold text-xs text-[#2B2926]">${primary}</span>
                ${dish.mgLevel === 'high' ? `<span class="chip-accent text-[9px] font-bold px-1 rounded">${t('filterMg')}</span>` : ''}
                ${dish.tags.includes('japanese') ? `<span class="text-[9px] text-[#8C6A1D] bg-[#E4DECE] px-1 rounded">${jpBadge}</span>` : ''}
              </div>
              <p class="text-[10px] text-[#2B2926]/60">${secondary}</p>
            </div>
            <span class="font-mincho text-[10px] bg-[#E4DECE] text-[#2B2926] px-1.5 py-0.5 rounded">${mealLabel}</span>
          </div>
          <p class="text-[11px] text-[#2B2926]/80 card-deep p-2 rounded-lg">${tip}</p>
          <div class="text-[10px] text-[#2B2926]/70">
            <span class="font-bold">${t('ingredientsLabel')}:</span> ${ingredientsText}
          </div>
          ${toggleBtn}
          ${stepsHtml}
        `;
        container.appendChild(card);
      });
    }

    function toggleRecipeSteps(dishId) {
      const list = document.getElementById('steps-' + dishId);
      const btn = document.getElementById('steps-toggle-' + dishId);
      if (!list || !btn) return;
      const isHidden = list.classList.contains('hidden');
      list.classList.toggle('hidden');
      btn.textContent = isHidden ? t('hideSteps') : t('viewSteps');
    }

    // Modal
    function openModal(dayKey, mealType) {
      activeModalContext = { dayKey, mealType };
      currentModalFilter = 'all';
      updateModalTitle();
      document.getElementById("dish-modal").classList.remove("hidden");
      renderModalList('all');
      safeCreateIcons();
    }

    function updateModalTitle() {
      if (!activeModalContext) return;
      const dConfig = DAYS_CONFIG.find(d => d.key === activeModalContext.dayKey);
      const mealKey = activeModalContext.mealType === 'breakfast' ? 'mealBreakfastFull' : activeModalContext.mealType === 'lunch' ? 'mealLunchFull' : 'mealDinnerFull';
      const mealLabel = t(mealKey);
      const dayLabel = langMode === "en" ? dConfig.labelEn : dConfig.label;
      document.getElementById("modal-title").textContent = langMode === "en"
        ? `Change ${dayLabel}'s ${mealLabel}`
        : `${dayLabel}の${mealLabel}を変更します`;
    }

    function closeModal() {
      document.getElementById("dish-modal").classList.add("hidden");
      activeModalContext = null;
    }

    function renderModalList(tag) {
      currentModalFilter = tag;
      const container = document.getElementById("modal-dish-list");
      container.innerHTML = "";

      let list = DISHES.filter(d => d.mealType === activeModalContext.mealType);
      if (tag === "mg") list = list.filter(d => d.mgLevel === "high");
      if (tag === "soup") list = list.filter(d => d.tags.includes("soup"));
      if (tag === "easy") list = list.filter(d => d.tags.includes("easy"));

      const current = schedule[activeModalContext.dayKey][activeModalContext.mealType];
      const avoidLabel = langMode === "en" ? "Excluded" : "除外設定中";

      list.forEach(dish => {
        const isSel = dish.id === current;
        const isAvoid = dish.avoidTags.some(tag2 => (profile.avoid || []).includes(tag2));
        const primary = langMode === "en" ? dish.name : dish.nameJa;
        const secondary = langMode === "en" ? dish.nameJa : dish.name;

        const item = document.createElement("div");
        item.onclick = () => { playAudioTone(); selectDish(dish.id); };
        item.className = `p-2.5 rounded-xl border cursor-pointer transition flex items-center justify-between ${
          isSel ? 'border-[#E0B23A] bg-[#EFEAE0]' : 'border-[#DDD6C6] bg-white hover:bg-[#FAF8F5]'
        }`;

        item.innerHTML = `
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="font-mincho font-bold text-xs text-[#2B2926]">${primary}</span>
              ${dish.mgLevel === 'high' ? '<span class="chip-accent text-[9px] font-bold px-1 rounded">Mg</span>' : ''}
              ${isAvoid ? `<span class="text-[9px] text-[#8C6A1D] bg-[#E4DECE] px-1 rounded">${avoidLabel}</span>` : ''}
            </div>
            <div class="text-[10px] text-[#2B2926]/60">${secondary}</div>
          </div>
          ${isSel ? '<i data-lucide="check" class="w-4 h-4 text-[#8C6A1D]"></i>' : ''}
        `;
        container.appendChild(item);
      });
      safeCreateIcons();
    }

    function filterModalDishes(tag) {
      document.querySelectorAll(".modal-tag-btn").forEach(btn => {
        if (btn.getAttribute("data-tag") === tag) {
          btn.className = "modal-tag-btn px-2.5 py-1 rounded-md bg-[#E0B23A] text-[#2B2926] font-mincho font-bold text-[11px]";
        } else {
          btn.className = "modal-tag-btn px-2.5 py-1 rounded-md card-base text-[#2B2926] font-mincho text-[11px]";
        }
      });
      renderModalList(tag);
    }

    function selectDish(dishId) {
      if (!activeModalContext) return;
      schedule[activeModalContext.dayKey][activeModalContext.mealType] = dishId;
      saveSchedule();
      closeModal();
    }

    // Tabs
    function switchTab(tabKey) {
      ['plan', 'shopping', 'recipes', 'settings'].forEach(key => {
        document.getElementById(`tab-${key}`).classList.add("hidden");
        const btn = document.getElementById(`nav-${key}`);
        if (btn) btn.className = "tab-item flex flex-col items-center gap-0.5 px-3 py-1 transition";
      });

      document.getElementById(`tab-${tabKey}`).classList.remove("hidden");
      const activeNav = document.getElementById(`nav-${tabKey}`);
      if (activeNav) activeNav.className = "tab-item active flex flex-col items-center gap-0.5 px-3 py-1 transition";

      if (tabKey === "recipes") renderRecipeMasterList("all");
    }

    function filterRecipeList(filter) {
      document.querySelectorAll(".recipe-filter-btn").forEach(btn => {
        if (btn.getAttribute("data-filter") === filter) {
          btn.className = "recipe-filter-btn px-3 py-1 rounded-full font-mincho font-bold bg-[#E0B23A] text-[#2B2926]";
        } else {
          btn.className = "recipe-filter-btn px-3 py-1 rounded-full font-mincho card-base text-[#2B2926]";
        }
      });
      renderRecipeMasterList(filter);
    }

    // PWA Init (wrapped in try/catch: some preview/sandbox environments block
    // Blob URLs or Service Worker registration, and an uncaught error here
    // would stop the rest of this script from running — including the
    // DOMContentLoaded listener below that renders the meal plan.)
    (function initPWA() {
      try {
        const manifest = {
          name: "KusinaBalance — 生活献立帳",
          short_name: "Kusina",
          start_url: "./",
          display: "standalone",
          background_color: "#EFEAE0",
          theme_color: "#EFEAE0",
